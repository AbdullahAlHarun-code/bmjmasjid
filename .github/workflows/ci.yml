name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  donation-storage:
    name: Donation integration (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping --silent
          - name: MariaDB 11.4
            image: mariadb:11.4
            health: mariadb-admin ping --silent
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: ephemeral_root_only
          MYSQL_USER: donation_test
          MYSQL_PASSWORD: ephemeral_ci_only
          MYSQL_DATABASE: donation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://donation_test:ephemeral_ci_only@127.0.0.1:3306/donation_test
      DONATION_TEST_DATABASE_URL: mysql://donation_test:ephemeral_ci_only@127.0.0.1:3306/donation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run test:donation-storage

  site-audit:
    name: Bilingual mobile and content audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-mobile-audit
          path: docs/site-audit/
