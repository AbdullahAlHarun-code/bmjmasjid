name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only preflight, or deploy after that preflight has passed
        type: choice
        options:
          - preflight
          - deploy
        default: preflight

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Photo date formatting
        run: npm run test:photo-dates

      - name: Deploy script checks
        run: bash scripts/test-deploy-production.sh

      - name: Production build
        run: npm run build

  donation-storage:
    name: Donation integration (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping --silent
          - name: MariaDB 11.4
            image: mariadb:11.4
            health: mariadb-admin ping --silent
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: ephemeral_root_only
          MYSQL_USER: donation_test
          MYSQL_PASSWORD: ephemeral_ci_only
          MYSQL_DATABASE: donation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://donation_test:ephemeral_ci_only@127.0.0.1:3306/donation_test
      DONATION_TEST_DATABASE_URL: mysql://donation_test:ephemeral_ci_only@127.0.0.1:3306/donation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run test:donation-storage

  site-audit:
    name: Bilingual mobile and content audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-mobile-audit
          path: docs/site-audit/

  deploy:
    name: Deploy production
    needs: [checks, donation-storage, site-audit]
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-bmjmasjid
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy exact commit
        id: deploy
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_PASSPHRASE: ${{ secrets.PRODUCTION_SSH_PASSPHRASE }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_NODE_SETUP: ${{ secrets.PRODUCTION_NODE_SETUP }}
          PRODUCTION_RESTART_COMMAND: ${{ secrets.PRODUCTION_RESTART_COMMAND }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci-deploy.sh

      - name: Verify public HTTPS site
        id: health
        if: steps.deploy.outputs.result == 'deployed'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/ci-health.sh

      - name: Roll back production
        if: failure() && steps.deploy.outputs.result == 'deployed' && steps.health.outcome == 'failure'
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_PASSPHRASE: ${{ secrets.PRODUCTION_SSH_PASSPHRASE }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_NODE_SETUP: ${{ secrets.PRODUCTION_NODE_SETUP }}
          PRODUCTION_RESTART_COMMAND: ${{ secrets.PRODUCTION_RESTART_COMMAND }}
          GITHUB_SHA: ${{ steps.deploy.outputs.previous }}
          ROLLBACK_MODE: "1"
        run: bash scripts/ci-deploy.sh

  preflight:
    name: Preflight production SSH
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.action == 'preflight'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.head_ref == 'cursor/production-auto-deploy-497c' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH and the production checkout
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_PASSPHRASE: ${{ secrets.PRODUCTION_SSH_PASSPHRASE }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_NODE_SETUP: ${{ secrets.PRODUCTION_NODE_SETUP }}
          PREFLIGHT: "1"
        run: bash scripts/ci-deploy.sh
